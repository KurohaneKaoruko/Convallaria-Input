name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  engine:
    name: fmt + clippy + test（引擎层）
    runs-on: windows-latest
    defaults:
      run:
        working-directory: crates/ime-core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: 格式检查
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: 测试
        run: cargo test
      - name: 基准编译检查（不运行）
        run: cargo bench --no-run
