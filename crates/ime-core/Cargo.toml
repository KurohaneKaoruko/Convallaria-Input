[package]
name = "ime-core"
version = "0.1.0"
edition = "2024"
description = "Convallaria Input 核心解码引擎：音节切分、码表、n-gram、Viterbi（平台无关）"

[dependencies]
fst = "0.4"
memmap2 = "0.9"
notify = "8"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
toml = "0.9"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "decode"
harness = false
