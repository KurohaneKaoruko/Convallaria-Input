[package]
name = "convallaria-windows"
version = "0.1.0"
edition = "2024"
description = "Convallaria Input Windows 前端：TSF 文本服务 + 候选窗"

[dependencies]
ime-core = { path = "../../crates/ime-core" }
windows-core = "0.62"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_SystemServices",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_TextServices",
    "Win32_UI_WindowsAndMessaging",
] }

[lib]
crate-type = ["cdylib"]
