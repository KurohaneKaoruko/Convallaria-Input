[package]
name = "convallaria-server"
version = "0.1.0"
edition = "2024"
description = "Convallaria Input 后台服务：命名管道服务端 + 引擎 + 候选窗（独立进程）"

[[bin]]
name = "convallaria-server"
path = "src/main.rs"

[dependencies]
ime-core = { path = "../../../crates/ime-core" }
convallaria-protocol = { path = "../../../crates/convallaria-protocol" }
serde_json = "1"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_LibraryLoader",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
windows-core = "0.62"
