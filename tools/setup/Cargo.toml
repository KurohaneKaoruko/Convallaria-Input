[package]
name = "convallaria-setup"
version = "0.1.0"
edition = "2024"
description = "Convallaria Input 安装包：单文件 setup（自包含 DLL 与词典，含卸载）"

[[bin]]
name = "convallaria-setup"
path = "src/main.rs"

[dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_System_LibraryLoader",
    "Win32_System_RestartManager",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_TextServices",
    "Win32_UI_WindowsAndMessaging",
] }
windows-core = "0.62"
